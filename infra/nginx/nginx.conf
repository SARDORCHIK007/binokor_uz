worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker DNS. A variable in proxy_pass forces a fresh lookup after containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hide the nginx version; keep upload size in line with the API's 5 MB image limit.
    server_tokens off;
    client_max_body_size 8m;

    server {
        listen 80;

        # Security headers (NFR-SEC). HSTS belongs on the TLS server block in production.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

        location /api/ {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $web_upstream web:3000;
            proxy_pass http://$web_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
