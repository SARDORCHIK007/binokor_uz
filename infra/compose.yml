name: uychibinokor

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Upstream minio/minio and quay.io/minio/minio are no longer public.
    # Silo is a MinIO-compatible server with the same health endpoint.
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    user: root
    volumes:
      - ../apps/api:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["arq", "app.workers.settings.WorkerSettings"]
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /src/apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-false}
      # prod (default): optimized build, fast page changes. dev: hot reload while coding.
      WEB_MODE: ${WEB_MODE:-prod}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ..:/src
      - web_modules:/src/apps/web/node_modules
    command:
      [
        "sh",
        "-c",
        "if [ ! -d node_modules/next ]; then npm ci; fi && if [ \"$$WEB_MODE\" = dev ]; then exec npx next dev --hostname 0.0.0.0 --port 3000; else npx next build && cp -r public .next/standalone/apps/web/ && cp -r .next/static .next/standalone/apps/web/.next/ && HOSTNAME=0.0.0.0 PORT=3000 exec node .next/standalone/apps/web/server.js; fi",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s

  bot:
    build:
      context: ../apps/bot
      dockerfile: Dockerfile
    env_file:
      - ../.env
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pgdata:
  minio:
  web_modules:
