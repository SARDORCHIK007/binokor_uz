name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  api:
    name: API (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: ub
          POSTGRES_PASSWORD: ub
          POSTGRES_DB: ub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ub" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://ub:ub@localhost:5432/ub
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: http://localhost:9000
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
      APP_ENV: ci
      DEMO_MODE: "true"
      EVIDENCE_DIR: /tmp/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m mypy app
      - name: Migrations upgrade / downgrade / upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Start API (loads demo data on startup)
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/v1/public/home > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/api.log
          exit 1
      - name: Tests
        shell: bash
        run: |
          set +e
          python -m pytest -q -rfE --tb=line 2>&1 | tee /tmp/pytest.txt
          status=${PIPESTATUS[0]}
          # Surface failures as annotations (readable without signing in).
          grep -E "^(FAILED|ERROR) |^/.*\.py:[0-9]+: " /tmp/pytest.txt | head -20 | while read -r line; do
            echo "::error title=pytest::${line}"
          done
          exit $status
      - if: failure()
        shell: bash
        run: |
          grep -E "Error|Traceback|error" /tmp/api.log | tail -10 | while read -r line; do
            echo "::warning title=api.log::${line}"
          done
          tail -n 200 /tmp/api.log || true
