[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/seed_portal.py" = ["E501"]
"app/routers/public.py" = ["E501"]
"app/routers/reports.py" = ["E501"]
"app/routers/applications.py" = ["E501"]
"app/routers/cabinet.py" = ["E501"]
"app/routers/admin_edu.py" = ["E501"]
"app/seed_education.py" = ["E501"]
"app/seed_learning.py" = ["E501"]
"app/routers/learning.py" = ["E501"]
"app/routers/certificates.py" = ["E501"]
"app/seed_certificates.py" = ["E501"]
"app/seed_vocab.py" = ["E501"]
"app/routers/vocab.py" = ["E501"]
"app/ratelimit.py" = ["E501"]
"app/routers/jobs.py" = ["E501"]
"app/seed_market.py" = ["E501"]
"app/seed_exam.py" = ["E501"]
"app/seed_followup.py" = ["E501"]
"app/routers/exams.py" = ["E501"]
"app/routers/curator.py" = ["E501"]
"app/routers/auth.py" = ["E501"]
"app/routers/employers.py" = ["E501"]
"app/routers/producers.py" = ["E501"]
"app/routers/portfolio.py" = ["E501"]
"app/seed_workers.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
