[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/seed_portal.py" = ["E501"]
"app/routers/public.py" = ["E501"]
"app/routers/reports.py" = ["E501"]
"app/routers/applications.py" = ["E501"]
"app/routers/cabinet.py" = ["E501"]
"app/routers/classroom.py" = ["E501"]
"app/routers/employer_desk.py" = ["E501"]
"app/routers/producer_desk.py" = ["E501"]
"app/routers/admin_edu.py" = ["E501"]
"app/seed_education.py" = ["E501"]
"app/seed_learning.py" = ["E501"]
"app/routers/learning.py" = ["E501"]
"app/routers/certificates.py" = ["E501"]
"app/seed_certificates.py" = ["E501"]
"app/seed_vocab.py" = ["E501"]
"app/routers/vocab.py" = ["E501"]
"app/ratelimit.py" = ["E501"]
"app/onboarding.py" = ["E501"]
"app/registration.py" = ["E501"]
"app/routers/onboarding.py" = ["E501"]
"app/routers/panels.py" = ["E501"]
"app/routers/payments.py" = ["E501"]
"app/routers/people.py" = ["E501"]
"app/routers/settings.py" = ["E501"]
"app/routers/district.py" = ["E501"]
"app/routers/graduates.py" = ["E501"]
"app/routers/employment.py" = ["E501"]
"app/routers/migration.py" = ["E501"]
"app/routers/vacancies.py" = ["E501"]
"app/routers/monitoring.py" = ["E501"]
"app/routers/partner_profile.py" = ["E501"]
"app/seed_staff.py" = ["E501"]
"app/cert_pdf.py" = ["E501"]
"app/inapp.py" = ["E501"]
"app/routers/cabinet_extra.py" = ["E501"]
"app/doc_i18n.py" = ["E501"]
"app/passport_card.py" = ["E501"]
"app/routers/passport.py" = ["E501"]
"app/seed_marketplace.py" = ["E501"]
"app/routers/market.py" = ["E501"]
"migrations/*" = ["E501"]
"app/routers/jobs.py" = ["E501"]
"app/seed_market.py" = ["E501"]
"app/seed_exam.py" = ["E501"]
"app/seed_followup.py" = ["E501"]
"app/routers/exams.py" = ["E501"]
"app/routers/curator.py" = ["E501"]
"app/routers/auth.py" = ["E501"]
"app/routers/employers.py" = ["E501"]
"app/routers/producers.py" = ["E501"]
"app/routers/portfolio.py" = ["E501"]
"app/seed_workers.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
